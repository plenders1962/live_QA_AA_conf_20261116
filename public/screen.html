<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q&A — screen</title>
<style>
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { background:#0f1722; color:#fff; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:24px; padding:16px 32px; background:#172234; }
  header h1 { margin:0; font-size:28px; flex:1; }
  header .join { text-align:right; font-size:20px; color:#9fb3cf; }
  header .join b { color:#fff; font-size:26px; display:block; }
  header img { height:96px; background:#fff; padding:6px; border-radius:8px; }
  main { flex:1; padding:20px 32px; overflow:hidden; display:flex; flex-direction:column; gap:14px; }
  .q { display:flex; gap:20px; align-items:center; background:#172234; border-radius:14px; padding:16px 22px; }
  .v { min-width:78px; text-align:center; font-size:38px; font-weight:800; color:#6fa0ff; }
  .v small { display:block; font-size:14px; font-weight:400; color:#9fb3cf; }
  .t { font-size:var(--fs,30px); line-height:1.25; overflow-wrap:anywhere; }
  .n { color:#9fb3cf; font-size:16px; margin-top:4px; }
  .big { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:24px; padding:0 6vw; }
  .big .t { font-size:clamp(32px,5.2vw,76px); font-weight:600; line-height:1.2; }
  .big .n { font-size:26px; }
  .big .v { font-size:56px; }
  .empty { margin:auto; font-size:34px; color:#9fb3cf; text-align:center; }
  .poll { flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:0 3vw; }
  .poll .lbl { font-size:20px; letter-spacing:.08em; text-transform:uppercase; color:#6fa0ff; font-weight:700; }
  .poll h2 { margin:0 0 6px; font-size:clamp(30px,4.2vw,60px); line-height:1.15; }
  .row { position:relative; background:#172234; border-radius:12px; overflow:hidden; }
  .row .fill { position:absolute; left:0; top:0; bottom:0; background:#2f5fd0; transition:width .5s; }
  .row .tx { position:relative; display:flex; justify-content:space-between; gap:20px; padding:var(--rp,12px) 22px; font-size:var(--rf,clamp(22px,3vw,40px)); }
  .row .tx b { font-variant-numeric:tabular-nums; }
  .poll .tot { color:#9fb3cf; font-size:22px; }
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="join"><span id="jl"></span><b id="url"></b></div>
  <img id="qr" alt="" hidden>
</header>
<main id="m"></main>
<script>
const qs = new URLSearchParams(location.search);
const lang = qs.get('lang') || ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
const T = lang === 'fr'
  ? { h:'Posez vos questions et votez', jl:'Rejoignez sur', empty:'En attente de vos questions…', anon:'Anonyme', votes:'votes', poll:'Sondage', closed:'Vote terminé', total:'participants', voteNow:'Votez depuis votre téléphone',
      note:'Pourcentages calculés sur l’ensemble des réponses données (plusieurs réponses possibles par personne)' }
  : { h:'Ask your questions and vote', jl:'Join at', empty:'Waiting for your questions…', anon:'Anonymous', votes:'votes', poll:'Poll', closed:'Voting closed', total:'participants', voteNow:'Vote on your phone',
      note:'Percentages are based on all answers given (each person could choose several)' };
const sortMode = qs.get('sort') === 'time' ? 'time' : 'pop';
const maxN = Number(qs.get('n') || 6);
const joinUrl = qs.get('url') || location.origin + '/' + (qs.get('lang') ? '?lang=' + qs.get('lang') : '');
const $ = (id) => document.getElementById(id);
$('h').textContent = T.h; $('jl').textContent = T.jl; $('url').textContent = joinUrl.replace(/^https?:\/\//, '');
const qr = $('qr');
qr.onload = () => { qr.hidden = false; };
qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data=' + encodeURIComponent(joinUrl);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

async function load() {
  let d; try { d = await (await fetch('/api/questions', { cache: 'no-store' })).json(); } catch (e) { return; }
  const m = $('m'); m.textContent = '';
  if (d.poll) {
    const p = d.poll, box = el('div', 'poll');
    box.appendChild(el('div', 'lbl', T.poll + (p.status === 'open' ? '' : ' · ' + T.closed)));
    box.appendChild(el('h2', '', p.question));
    const reveal = p.counts !== null; // the moderator decides when results appear
    // share of all answers given, rounded so the total is exactly 100
    const P = (() => {
      const c = p.counts || [], t = c.reduce((a, b) => a + b, 0);
      if (!t) return c.map(() => 0);
      const raw = c.map((x) => 100 * x / t), fl = raw.map(Math.floor); let rem = 100 - fl.reduce((a, b) => a + b, 0);
      raw.map((r, i) => [r - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach((x) => { if (rem-- > 0) fl[x[1]]++; });
      return fl;
    })();
    const n = p.options.length; // keep everything on screen, even with 8 answers
    box.style.setProperty('--rf', n <= 4 ? 'clamp(22px,3vw,40px)' : n <= 6 ? 'clamp(18px,2.4vw,32px)' : 'clamp(16px,2vw,26px)');
    box.style.setProperty('--rp', n <= 4 ? '12px' : n <= 6 ? '8px' : '5px');
    p.options.forEach((o, i) => {
      const row = el('div', 'row'); const tx = el('div', 'tx'); tx.appendChild(el('span', '', o));
      if (reveal) {
        const pct = P[i];
        const fill = el('div', 'fill'); fill.style.width = pct + '%'; row.appendChild(fill);
        tx.appendChild(el('b', '', pct + '%  (' + p.counts[i] + ')'));
      }
      row.appendChild(tx); box.appendChild(row);
    });
    box.appendChild(el('div', 'tot', (reveal ? '' : (p.status === 'open' ? T.voteNow + ' · ' : '')) + p.voters + ' ' + T.total));
    if (reveal && p.multi) box.appendChild(el('div', 'tot', T.note));
    m.appendChild(box); return;
  }
  const open = d.questions.filter((q) => !q.answered);
  const feat = open.find((q) => q.id === d.featuredId);
  if (feat) {
    const b = el('div', 'big');
    b.appendChild(el('div', 't', feat.text));
    b.appendChild(el('div', 'n', (feat.name || T.anon) + ' · ' + feat.votes + ' ' + T.votes));
    m.appendChild(b); return;
  }
  const list = open.sort(sortMode === 'pop' ? (a, b) => (b.votes - a.votes) || (b.ts - a.ts) : (a, b) => b.ts - a.ts).slice(0, maxN);
  if (!list.length) { m.appendChild(el('div', 'empty', T.empty)); return; }
  const fs = list.length <= 3 ? 40 : list.length <= 5 ? 32 : 28;
  m.style.setProperty('--fs', fs + 'px');
  list.forEach((q) => {
    const c = el('div', 'q');
    const v = el('div', 'v', String(q.votes)); v.appendChild(el('small', '', T.votes));
    const b = el('div'); b.appendChild(el('div', 't', q.text)); b.appendChild(el('div', 'n', q.name || T.anon));
    c.append(v, b); m.appendChild(c);
  });
}
load();
const es = new EventSource('/api/stream'); es.addEventListener('update', load);
setInterval(load, 10000);
</script>
</body>
</html>
